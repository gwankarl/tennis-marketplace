name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: 'true'
      # Valid placeholder for startup validation only; no app test connects using this URL.
      DATABASE_URL: postgresql://127.0.0.1:5432/tennis_xpress_ci_unused
      TEST_DATABASE_URL: postgresql://tennis_xpress_test:ci_test_only@127.0.0.1:5432/tennis_xpress_test
      API_BASE_URL: http://127.0.0.1:3100

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_admin_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24 with npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked workspace dependencies
        run: npm ci

      - name: Confirm PostgreSQL readiness
        run: docker exec "${{ job.services.postgres.id }}" pg_isready -U postgres -d postgres

      - name: Create restricted integration login
        run: >-
          docker exec "${{ job.services.postgres.id }}"
          psql -U postgres -d postgres -v ON_ERROR_STOP=1
          -c "CREATE ROLE tennis_xpress_test LOGIN PASSWORD 'ci_test_only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;"

      - name: Create dedicated integration database
        run: >-
          docker exec "${{ job.services.postgres.id }}"
          psql -U postgres -d postgres -v ON_ERROR_STOP=1
          -c "CREATE DATABASE tennis_xpress_test OWNER tennis_xpress_test;"

      - name: Check formatting
        run: npm run format:check

      - name: Lint workspaces
        run: npm run lint

      - name: Type check workspaces
        run: npm run typecheck

      - name: Run backend tests
        run: npm run test:backend

      - name: Run frontend tests
        run: npm run test:frontend

      - name: Run PostgreSQL integration tests
        run: npm run test:backend:integration

      - name: Install Playwright Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Build workspaces
        run: npm run build

      - name: Upload browser failure reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failure-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 3
